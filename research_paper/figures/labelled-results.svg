<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">Labelled traffic results by scenario</title>
  <desc id="desc">Average RTT and sample count for idle, 2 megabit load, 4 megabit load, and delay ramp scenarios.</desc>
  <rect width="900" height="470" fill="white"/>
  <text x="450" y="34" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Stored labelled-data results</text>
  <text x="450" y="61" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Average RTT (ms) and sample count by scenario</text>
  <line x1="95" y1="390" x2="850" y2="390" stroke="#222" stroke-width="2"/>
  <line x1="95" y1="90" x2="95" y2="390" stroke="#222" stroke-width="2"/>
  <g font-family="Arial" font-size="12" fill="#333">
    <text x="88" y="394" text-anchor="end">0</text>
    <text x="88" y="319" text-anchor="end">50</text>
    <text x="88" y="244" text-anchor="end">100</text>
    <text x="88" y="169" text-anchor="end">150</text>
    <text x="88" y="94" text-anchor="end">200</text>
    <text x="30" y="240" text-anchor="middle" transform="rotate(-90 30 240)">Average RTT (ms)</text>
  </g>
  <g stroke="#d7dce5" stroke-dasharray="4 4">
    <line x1="95" y1="315" x2="850" y2="315"/><line x1="95" y1="240" x2="850" y2="240"/>
    <line x1="95" y1="165" x2="850" y2="165"/><line x1="95" y1="90" x2="850" y2="90"/>
  </g>
  <g fill="#356ae6">
    <rect x="145" y="349.8" width="72" height="40.2"/><rect x="325" y="343.5" width="72" height="46.5"/>
    <rect x="505" y="283.8" width="72" height="106.2"/><rect x="685" y="154.5" width="72" height="235.5"/>
  </g>
  <g font-family="Arial" font-size="13" fill="#111" text-anchor="middle">
    <text x="181" y="342">26.80</text><text x="361" y="336">30.98</text>
    <text x="541" y="276">70.83</text><text x="721" y="147">157.00</text>
    <text x="181" y="414">idle</text><text x="361" y="414">load_2M</text>
    <text x="541" y="414">load_4M</text><text x="721" y="414">delay_ramp</text>
    <text x="181" y="435" fill="#555">n=32</text><text x="361" y="435" fill="#555">n=25</text>
    <text x="541" y="435" fill="#555">n=24</text><text x="721" y="435" fill="#555">n=36</text>
  </g>
  <rect x="720" y="72" width="16" height="16" fill="#356ae6"/><text x="744" y="85" font-family="Arial" font-size="13">Average RTT</text>
</svg>
