<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#e8f1fb"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#315d8c"/>
    </marker>
    <style>
      .title{font:700 28px Arial;fill:#17324d}.label{font:700 18px Arial;fill:#17324d}
      .text{font:16px Arial;fill:#29465e}.small{font:14px Arial;fill:#48657c}
      .box{stroke:#315d8c;stroke-width:2;rx:16}.arrow{stroke:#315d8c;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="620" fill="url(#bg)"/>
  <text x="600" y="48" text-anchor="middle" class="title">Self-Healing SDN System Architecture</text>
  <rect x="55" y="105" width="235" height="175" fill="#d9ecff" class="box"/>
  <text x="172" y="140" text-anchor="middle" class="label">Operations UI</text>
  <text x="80" y="178" class="text">React dashboard</text><text x="80" y="207" class="text">Health and topology</text><text x="80" y="236" class="text">Telemetry and experiments</text>
  <rect x="340" y="105" width="245" height="175" fill="#dff5e7" class="box"/>
  <text x="462" y="140" text-anchor="middle" class="label">Management Layer</text>
  <text x="365" y="178" class="text">FastAPI services</text><text x="365" y="207" class="text">SQLite history</text><text x="365" y="236" class="text">Alerts and event records</text>
  <rect x="635" y="105" width="245" height="175" fill="#fff0cf" class="box"/>
  <text x="757" y="140" text-anchor="middle" class="label">Control Layer</text>
  <text x="660" y="178" class="text">Baseline routing</text><text x="660" y="207" class="text">Reactive recovery</text><text x="660" y="236" class="text">Fast failover and adaptive policy</text>
  <rect x="930" y="105" width="215" height="175" fill="#fbe0e0" class="box"/>
  <text x="1037" y="140" text-anchor="middle" class="label">Data Plane</text>
  <text x="952" y="178" class="text">Open vSwitch</text><text x="952" y="207" class="text">OpenFlow 1.3</text><text x="952" y="236" class="text">Hosts and links</text>
  <path d="M290 192 H340" class="arrow"/><path d="M585 192 H635" class="arrow"/><path d="M880 192 H930" class="arrow"/>
  <rect x="170" y="380" width="860" height="150" fill="#ffffff" stroke="#7997b5" stroke-width="2" rx="18"/>
  <text x="600" y="420" text-anchor="middle" class="label">Observability and Recovery Feedback</text>
  <text x="215" y="462" class="text">Counters</text><text x="215" y="491" class="small">bytes, packets, drops, errors</text>
  <text x="465" y="462" class="text">Measurements</text><text x="465" y="491" class="small">RTT, jitter, loss, utilization</text>
  <text x="740" y="462" class="text">Recovery evidence</text><text x="740" y="491" class="small">events, alerts, route changes</text>
  <path d="M1037 280 V350 H890 V380" class="arrow"/><path d="M600 380 V320 H757 V280" class="arrow"/>
</svg>
