<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#edf6f1"/></linearGradient>
    <style>
      .title{font:700 28px Arial;fill:#17324d}.node{fill:#d9ecff;stroke:#315d8c;stroke-width:3}
      .host{fill:#fff0cf;stroke:#a46b20;stroke-width:2}.edge{stroke:#557896;stroke-width:5;fill:none}
      .backup{stroke:#2e8b57;stroke-width:5;stroke-dasharray:12 9;fill:none}.t{font:700 17px Arial;fill:#17324d}.s{font:15px Arial;fill:#29465e}
    </style>
  </defs>
  <rect width="1200" height="620" fill="url(#bg)"/>
  <text x="600" y="48" text-anchor="middle" class="title">Multipath SDN Topology</text>
  <path d="M150 300 L350 170 L600 300 L850 170 L1050 300" class="edge"/>
  <path d="M150 300 L350 430 L600 300 L850 430 L1050 300" class="backup"/>
  <path d="M350 170 L350 430 M850 170 L850 430" class="edge"/>
  <circle cx="150" cy="300" r="44" class="host"/><text x="150" y="306" text-anchor="middle" class="t">h1</text>
  <circle cx="1050" cy="300" r="44" class="host"/><text x="1050" y="306" text-anchor="middle" class="t">h2</text>
  <circle cx="350" cy="170" r="42" class="node"/><text x="350" y="176" text-anchor="middle" class="t">s1</text>
  <circle cx="350" cy="430" r="42" class="node"/><text x="350" y="436" text-anchor="middle" class="t">s2</text>
  <circle cx="600" cy="300" r="42" class="node"/><text x="600" y="306" text-anchor="middle" class="t">s3</text>
  <circle cx="850" cy="170" r="42" class="node"/><text x="850" y="176" text-anchor="middle" class="t">s4</text>
  <circle cx="850" cy="430" r="42" class="node"/><text x="850" y="436" text-anchor="middle" class="t">s5</text>
  <line x1="400" y1="555" x2="470" y2="555" class="edge"/><text x="480" y="561" class="s">primary path</text>
  <line x1="700" y1="555" x2="770" y2="555" class="backup"/><text x="780" y="561" class="s">alternate path</text>
</svg>
